# =============================================================================
# Tmux Status Bar Configuration
# Indigo Glass Theme
# Design Principles: Muted contrast, lavender chrome, cyan accents
# =============================================================================

# Status bar essentials
set -g status on
set -g status-position bottom
set -g status-justify centre
set -g status-left-length 24
set -g status-right-length 24

# =============================================================================
# Colors: Indigo, Lavender, Cyan
# =============================================================================
# Background: #202748 (muted indigo)
# Foreground: #d9def5 (cool lavender)
# Accent: #97f7ff (cyan)
# Inactive: #9aa3c7 (desaturated lavender)

set -g status-style 'fg=#d9def5,bg=#202748'
set -g status-bg '#202748'
set -g status-fg '#d9def5'

# Pane chrome
set -g pane-border-style 'fg=#5f688f'
set -g pane-active-border-style 'fg=#8d98c8'
set -g pane-border-status top
set -g pane-border-format '#[fg=#6f79a7] #P #[fg=#aeb6d7]#{pane_current_command} '
set -g popup-border-style 'fg=#8d98c8,bg=#141a36'
set -g popup-style 'fg=#d9def5,bg=#141a36'
set -g message-style 'fg=#eef2ff,bg=#343d66'
set -g message-command-style 'fg=#eef2ff,bg=#343d66'
set -g mode-style 'fg=#10162c,bg=#97f7ff,bold'

# =============================================================================
# Window Status Styling
# =============================================================================

set -g window-status-separator ' '

# Current window: soft periwinkle chip with dark text
setw -g window-status-current-format '#[fg=#10162c,bg=#8592c2] #I #W '
setw -g window-status-current-style 'fg=#10162c,bg=#8592c2'

# Inactive windows: low-contrast labels that sit into the bar
setw -g window-status-format '#[fg=#8f98bf,bg=#202748] #I #W '
setw -g window-status-style 'fg=#8f98bf,bg=#202748'

# Alerts remain vivid without changing the overall palette
setw -g window-status-activity-style 'fg=#97f7ff,bg=#202748,bold'
setw -g window-status-bell-style 'fg=#ff9ac1,bg=#202748,bold'

# =============================================================================
# Status Layout
# =============================================================================
# Left: Session label
# Center: Window list
# Right: Time

set -g status-left '#[fg=#97f7ff,bg=#202748]#S #[default]'
set -g status-right '#[fg=#7d86ad,bg=#202748]%a #[fg=#d9def5,bg=#202748]%H:%M #[default]'

# =============================================================================
# Activity Monitoring
# =============================================================================

setw -g monitor-activity on
set -g visual-activity off
setw -g monitor-bell off
setw -g monitor-silence 0

# =============================================================================
# End
# =============================================================================
